adm_compendium_title: "Additive Damage Modifiers"
adm_compendium_intro: "Resistance and weakness values add together only for Characters, using separate player and non-player settings. Trees, logs, rocks and structures keep their existing damage handling. This page uses the server's current configuration."

adm_compendium_pov_heading: "PathOfValheiman Compatibility Mode"
adm_compendium_pov_intro: "PathOfValheiman was detected at startup. ADM resistance patches are inactive; resistance handling is left to the game, PathOfValheiman and other installed mods."
adm_compendium_pov_disabled: "ADM player and non-player modifier percentages, additive stacking, player minimum damage, the player's default Spirit/Chop/Pickaxe conversion to Ignore, and the Cold/Freezing threshold are not applied. ADM source percentages, Net and MinTotal are hidden."
adm_compendium_pov_settings: "Existing ADM settings are preserved, not deleted. Inactive resistance settings do not affect gameplay in this mode. Remove or disable PathOfValheiman and restart the game to restore ADM resistance handling; changing plugins during a running session is not supported."
adm_compendium_pov_retained: "Fall damage remains active: maximum base damage {0}, multiplier {1}x. The adm_* status effects remain registered and supply their native modifier tiers to the active resistance rules, not ADM percentages."
adm_compendium_pov_cold: "Cold and Freezing protection continues to use the game's Frost resistance tiers, including suitable equipment and frost resistance mead. PathOfValheiman's numeric Frost resistance bonuses alone do not grant this protection; its separate Cold resistance reduces the penalties of an applied Cold/Freezing effect instead."

adm_tooltip_net_label: "Net"
adm_tooltip_min_total_label: "MinTotal"
adm_tooltip_ignore: "Ignore"

adm_compendium_current_heading: "Current Modifier Values"
adm_compendium_current_intro: "Positive values increase damage taken. Negative values reduce damage taken."
adm_compendium_player_heading: "Players"
adm_compendium_nonplayer_heading: "Non-Player Characters"

adm_compendium_calculation_heading: "How Damage Is Calculated"
adm_compendium_sum_rule: "All modifiers for one damage type are added first. A player minimum, when configured, is applied after that sum."
adm_compendium_formula: "Damage taken = original damage x (100% + total modifier)"
adm_compendium_example: "Player example: {0} = {1}, so {2} of the original damage is taken before any player minimum."

adm_compendium_minimum_heading: "Player Minimum Damage"
adm_compendium_minimum_intro: "These limits apply only when the target is a player. MinTotal is the lowest total modifier allowed: a 10% damage minimum is MinTotal -90%."
adm_compendium_minimum_line: "{0}: at least {1} of original damage (MinTotal {2})"
adm_compendium_spirit_rule: "At player initialization, the default Immune values for Spirit, Chop and Pickaxe become Ignore. These damage types have no player minimum; ordinary resistance and weakness effects cannot override Ignore. Other base values and non-player Characters are not changed."

adm_compendium_vanilla_heading: "Vanilla Comparison"
adm_compendium_vanilla_rule: "Vanilla Valheim selects one final category using override priority; resistance and weakness values are not added."
adm_compendium_additive_rule: "For Characters, this mod adds resistance and weakness values instead, so they can cancel each other and application order does not change the result. Ignore remains separate."

adm_compendium_special_heading: "Special Rules"
adm_compendium_immune_rule: "For players, Immune contributes {0}; other Characters use their own value shown above. Weakness can offset Immune, and player minimums still apply to capped damage types."
adm_compendium_ignore_rule: "Ignore is different from Immune: it makes that damage type deal 0 in resistance calculations and does not participate in the additive sum."
adm_compendium_frost_rule: "Cold and Freezing immunity triggers when the combined Frost modifier is {0} or lower."
