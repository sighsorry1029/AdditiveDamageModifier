adm_compendium_title: "가산 피해 보정"
adm_compendium_intro: "피해 유형별 저항과 약점 수치를 모두 더해서 적용합니다. 이 페이지에는 현재 서버 설정값이 표시됩니다."

adm_compendium_current_heading: "현재 보정 수치"
adm_compendium_current_intro: "양수는 받는 피해를 늘리고, 음수는 받는 피해를 줄입니다."

adm_compendium_calculation_heading: "피해 계산 방식"
adm_compendium_sum_rule: "한 피해 유형에 적용된 모든 보정 수치를 먼저 더합니다. 플레이어 최소 피해가 설정되어 있으면 합산한 뒤에 적용합니다."
adm_compendium_formula: "받는 피해 = 원래 피해 x (100% + 보정 수치 총합)"
adm_compendium_example: "예시: {0} = {1}이므로 플레이어 최소 피해를 적용하기 전에는 원래 피해의 {2}를 받습니다."

adm_compendium_minimum_heading: "플레이어 최소 피해"
adm_compendium_minimum_intro: "이 제한은 대상이 플레이어일 때만 적용됩니다. MinTotal은 허용되는 가장 낮은 보정 수치 총합입니다. 최소 피해가 10%라면 MinTotal은 -90%입니다."
adm_compendium_minimum_line: "{0}: 원래 피해의 최소 {1} (MinTotal {2})"
adm_compendium_spirit_rule: "영혼 피해에는 플레이어 최소 피해가 없습니다. 바닐라 플레이어가 원래 영혼 피해에 면역이기 때문입니다."

adm_compendium_vanilla_heading: "바닐라와의 차이"
adm_compendium_vanilla_rule: "바닐라 Valheim은 우선순위 규칙에 따라 최종 보정 단계 하나를 선택하며, 저항과 약점 수치를 서로 더하지 않습니다."
adm_compendium_additive_rule: "이 모드는 모든 수치를 더하므로 저항과 약점이 서로 상쇄되며, 적용 순서에 따라 결과가 달라지지 않습니다."

adm_compendium_special_heading: "특수 규칙"
adm_compendium_immune_rule: "면역은 {0}로 합산되므로 약점으로 상쇄할 수 있습니다. 최소 피해가 있는 피해 유형은 플레이어 최소 피해도 적용됩니다."
adm_compendium_ignore_rule: "무시는 면역과 다릅니다. 해당 피해 유형의 피해를 항상 0으로 만들며 가산 합계에 참여하지 않습니다."
adm_compendium_frost_rule: "냉기 보정 수치 총합이 {0} 이하이면 추위와 동결에 면역이 됩니다."
